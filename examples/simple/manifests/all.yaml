apiVersion: v1
data:
    LOG_LEVEL: info
    UPSTREAM: http://redis:6379
kind: ConfigMap
metadata:
    labels:
        app.kubernetes.io/instance: web
        app.kubernetes.io/managed-by: compose-to-k8s
        app.kubernetes.io/name: web
    name: web-env
---
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/instance: redis
        app.kubernetes.io/managed-by: compose-to-k8s
        app.kubernetes.io/name: redis
    name: redis
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/instance: redis
            app.kubernetes.io/name: redis
    template:
        metadata:
            labels:
                app.kubernetes.io/instance: redis
                app.kubernetes.io/managed-by: compose-to-k8s
                app.kubernetes.io/name: redis
        spec:
            containers:
                - image: redis:7
                  name: redis
                  ports:
                    - containerPort: 6379
                      protocol: TCP
                  readinessProbe:
                    initialDelaySeconds: 5
                    periodSeconds: 10
                    tcpSocket:
                        port: 6379
                  volumeMounts:
                    - mountPath: /data
                      name: vol-0
            volumes:
                - emptyDir: {}
                  name: vol-0
---
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/instance: web
        app.kubernetes.io/managed-by: compose-to-k8s
        app.kubernetes.io/name: web
    name: web
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/instance: web
            app.kubernetes.io/name: web
    template:
        metadata:
            labels:
                app.kubernetes.io/instance: web
                app.kubernetes.io/managed-by: compose-to-k8s
                app.kubernetes.io/name: web
        spec:
            containers:
                - envFrom:
                    - configMapRef:
                        name: web-env
                  image: nginx:1.25
                  name: web
                  ports:
                    - containerPort: 80
                      protocol: TCP
                  readinessProbe:
                    initialDelaySeconds: 5
                    periodSeconds: 10
                    tcpSocket:
                        port: 80
---
apiVersion: v1
kind: Service
metadata:
    labels:
        app.kubernetes.io/instance: redis
        app.kubernetes.io/managed-by: compose-to-k8s
        app.kubernetes.io/name: redis
    name: redis
spec:
    ports:
        - name: port-6379
          port: 6379
          protocol: TCP
          targetPort: 6379
    selector:
        app.kubernetes.io/instance: redis
        app.kubernetes.io/name: redis
    type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
    labels:
        app.kubernetes.io/instance: web
        app.kubernetes.io/managed-by: compose-to-k8s
        app.kubernetes.io/name: web
    name: web
spec:
    ports:
        - name: port-8080
          port: 8080
          protocol: TCP
          targetPort: 80
    selector:
        app.kubernetes.io/instance: web
        app.kubernetes.io/name: web
    type: ClusterIP
